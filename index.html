<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body { font-family: sans-serif; margin: 0; padding: 12px; background: #f4f6f8; }
  nav { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; }
  button { padding: 10px 14px; border: 0; border-radius: 8px; background: #1f3a5f; color: #fff; font-size: 15px; }
  .card { background: #fff; border-radius: 10px; padding: 12px; margin: 8px 0; box-shadow: 0 1px 3px #0002; }
  input, select, textarea { width: 100%; box-sizing: border-box; padding: 10px; margin: 4px 0 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; }
  .tab { display: none; } .tab.on { display: block; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: #dde; }
</style>
</head>
<body>
<nav>
  <button onclick="tab('harian')">Harian</button>
  <button onclick="tab('lapor')">Lapor</button>
  <button onclick="tab('pm')">Jadwal PM</button>
  <button onclick="tab('wo')">WO</button>
  <button onclick="tab('kpi')">KPI</button>
</nav>

<section id="harian" class="tab">
  <select id="h_mesin"></select>
  <input id="h_op" placeholder="Nama operator">
  <input id="h_tgl" type="date">
  <div id="h_items"></div>
  <button onclick="kirimHarian()">Kirim checklist</button>
</section>

<section id="lapor" class="tab">
  <select id="l_mesin"></select>
  <input id="l_pelapor" placeholder="Nama pelapor">
  <textarea id="l_gejala" rows="3" placeholder="Gejala kerusakan"></textarea>
  <select id="l_urgensi"><option>Rendah</option><option>Sedang</option><option>Tinggi</option></select>
  <label><input type="checkbox" id="l_berhenti"> Mesin berhenti</label>
  <button onclick="kirimLapor()">Buat WO</button>
</section>

<section id="pm" class="tab"><div id="pm_list"></div></section>
<section id="wo" class="tab"><div id="wo_list"></div></section>
<section id="kpi" class="tab"><div id="kpi_box"></div></section>

<script>
const STATUS = ['Baru', 'Ditugaskan', 'Dikerjakan', 'Menunggu Spare Part', 'Uji Jalan', 'Selesai'];
let KEY = localStorage.getItem('k') || prompt('Kode akses:');
localStorage.setItem('k', KEY);
let CL = [];

function run(fn, ...args) {
  return new Promise((ok, err) => {
    google.script.run
      .withSuccessHandler(ok)
      .withFailureHandler(e => {
        if (String(e).includes('AKSES')) {
          localStorage.removeItem('k');
          alert('Kode akses salah. Masukkan ulang.');
          KEY = prompt('Kode akses:');
          localStorage.setItem('k', KEY);
        }
        err(e);
      })[fn](KEY, ...args);
  });
}

function tab(id) {
  document.querySelectorAll('.tab').forEach(s => s.classList.toggle('on', s.id === id));
  const fn = ({ harian: initHarian, lapor: initLapor, pm: loadPM, wo: loadWO, kpi: loadKPI })[id];
  fn().catch(e => alert('Gagal memuat: ' + (e.message || e)));
}

async function loadMesinOpsi() {
  const m = await run('getMesin');
  const opsi = m.map(x => `<option value="${esc(x.id_mesin)}">${esc(x.nama)}</option>`).join('');
  document.getElementById('h_mesin').innerHTML = opsi;
  document.getElementById('l_mesin').innerHTML = opsi;
}

async function initHarian() {
  await loadMesinOpsi();
  document.getElementById('h_tgl').value = new Date().toISOString().slice(0, 10);
  CL = await run('getChecklist');
  if (!CL || CL.length === 0) {
    alert('Checklist kosong. Periksa CHECKLIST di Code.gs.');
    return;
  }
  document.getElementById('h_items').innerHTML = CL.map((c, i) => `
    <div class="card">${esc(c)}<br>
      <label><input type="radio" name="c${i}" value="OK" checked> OK</label>
      <label><input type="radio" name="c${i}" value="Not OK"> Not OK</label>
      <input id="cat${i}" placeholder="catatan">
    </div>`).join('');
}

async function kirimHarian() {
  const items = CL.map((c, i) => ({
    item: c,
    hasil: document.querySelector(`input[name=c${i}]:checked`).value,
    catatan: document.getElementById('cat' + i).value
  }));
  const r = await run('submitHarian', {
    tanggal: g('h_tgl'), id_mesin: g('h_mesin'), operator: g('h_op'), items
  });
  if (r.adaNotOk) {
    if (confirm('Ada item Not OK. Buka form laporan kerusakan?')) {
      document.getElementById('l_mesin').value = g('h_mesin');
      document.getElementById('l_pelapor').value = g('h_op');
      tab('lapor');
    }
  } else alert('Checklist tersimpan.');
}

async function initLapor() { await loadMesinOpsi(); }

async function kirimLapor() {
  const id = await run('buatWO', {
    tipe: 'Corrective', id_mesin: g('l_mesin'), pelapor: g('l_pelapor'),
    gejala: g('l_gejala'), urgensi: g('l_urgensi'),
    mesin_berhenti: document.getElementById('l_berhenti').checked ? 'Ya' : 'Tidak'
  });
  alert('WO dibuat: ' + id);
  tab('wo');
}

async function loadPM() {
  const list = await run('getJadwalPM');
  document.getElementById('pm_list').innerHTML = list.length
    ? list.map(m => `<div class="card"><b>${esc(m.nama)}</b><br>
        Jatuh tempo: ${esc(String(m.pm_berikutnya).slice(0, 10))}<br>
        <button onclick="buatPM('${esc(m.id_mesin)}')">Buat WO Preventive</button></div>`).join('')
    : 'Tidak ada jadwal PM yang jatuh tempo.';
}

async function buatPM(idMesin) {
  await run('buatWO', { tipe: 'Preventive', id_mesin: idMesin });
  loadPM();
}

async function loadWO() {
  const list = await run('getWO');
  document.getElementById('wo_list').innerHTML = list.map(w => {
    const id = esc(w.id_wo);
    return `<div class="card">
      <b>${id}</b> <span class="badge">${esc(w.tipe)}</span><br>
      Mesin ${esc(w.id_mesin)} · urgensi ${esc(w.urgensi)} · ${esc(w.status)}<br>
      ${esc(w.gejala)}
      <select id="s_${id}">${STATUS.map(s =>
        `<option ${s === w.status ? 'selected' : ''}>${s}</option>`).join('')}</select>
      <input id="t_${id}" placeholder="Teknisi" value="${esc(w.teknisi)}">
      <input id="p_${id}" placeholder="Penyebab" value="${esc(w.penyebab)}">
      <input id="a_${id}" placeholder="Tindakan" value="${esc(w.tindakan)}">
      <input id="sp_${id}" placeholder="Spare part" value="${esc(w.spare_part)}">
      <button onclick="simpanWO('${id}')">Simpan</button>
    </div>`;
  }).join('') || 'Belum ada WO.';
}

async function simpanWO(id) {
  await run('updateWO', id, {
    status: g('s_' + id), teknisi: g('t_' + id), penyebab: g('p_' + id),
    tindakan: g('a_' + id), spare_part: g('sp_' + id)
  });
  loadWO();
}

async function loadKPI() {
  const k = await run('getKPI');
  document.getElementById('kpi_box').innerHTML = `
    <div class="card">
      WO terbuka: <b>${k.terbuka}</b><br>
      WO selesai: <b>${k.selesai}</b><br>
      MTTR (menit): <b>${k.mttr}</b><br>
      Rata-rata waktu respons (menit): <b>${k.respons}</b>
    </div>`;
}

window.onload = () => { if (KEY) tab('harian'); };
</script>
</body>
</html>
